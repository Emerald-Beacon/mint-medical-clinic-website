[build]
  publish = "."
  functions = "netlify/functions"
  # Function deps live in netlify/functions/package.json (a subdir), but Netlify's
  # dependency install runs at the repo root. Install them explicitly so esbuild can
  # resolve @netlify/blobs when bundling. Without this, every git-triggered build fails
  # with "Could not resolve @netlify/blobs" (exit 2).
  command = "npm install --prefix netlify/functions"

[functions]
  node_bundler = "esbuild"

# Redirect for blog webhook
[[redirects]]
  from = "/api/blog-webhook"
  to = "/.netlify/functions/blog-webhook-simple"
  status = 200

# Redirect for admin auth
[[redirects]]
  from = "/api/admin-auth"
  to = "/.netlify/functions/admin-auth"
  status = 200

# Pretty URLs for blog articles (optional - for cleaner URLs)
[[redirects]]
  from = "/blog/:slug"
  to = "/blog/article.html?slug=:slug"
  status = 200

# Affiliate program. /affiliate already resolves to affiliate.html via pretty URLs;
# these catch the variants people actually type or get told over the phone.
[[redirects]]
  from = "/affiliates"
  to = "/affiliate"
  status = 301

[[redirects]]
  from = "/affiliate-program"
  to = "/affiliate"
  status = 301

# force = true is required: the file affiliate.html exists, and Netlify serves an
# existing static file in preference to a redirect rule unless the rule is forced.
[[redirects]]
  from = "/affiliate.html"
  to = "/affiliate"
  status = 301
  force = true

[[redirects]]
  from = "/partners"
  to = "/affiliate"
  status = 301

[[redirects]]
  from = "/partner"
  to = "/affiliate"
  status = 301

[[redirects]]
  from = "/referral"
  to = "/affiliate"
  status = 301

# Contact page. /contact resolves to contact.html via pretty URLs; force the
# .html variant to the clean URL (Netlify serves an existing static file in
# preference to a redirect unless the rule is forced).
[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

# Clean URLs for ad landing pages
[[redirects]]
  from = "/glp1"
  to = "/lp/glp1.html"
  status = 200

[[redirects]]
  from = "/weight-loss"
  to = "/lp/glp1.html"
  status = 200

[[redirects]]
  from = "/awt"
  to = "/lp/acoustic-wave-therapy.html"
  status = 200

[[redirects]]
  from = "/acoustic-wave-therapy"
  to = "/lp/acoustic-wave-therapy.html"
  status = 200

[[redirects]]
  from = "/mens-performance"
  to = "/lp/acoustic-wave-therapy.html"
  status = 200

# Headers for security and caching
[[headers]]
  for = "/data/articles.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS use ?v= cache-busting in the HTML, so browsers must revalidate
# rather than trust a stale 1-year "immutable" copy. ETag makes this cheap
# (304 Not Modified) while guaranteeing updated styles always load.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
